version: 2

models:
  - name: stg_customers
    description: "Tabela de clientes cadastrados na plataforma"
    database: postgres_raw
    schema: olist
    columns:
      - name: customer_id
        description: "Identificador do cliente"
        data_type: STRING
        primary_key: true
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "Identificador único do cliente"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - unique
      - name: customer_zip_code_prefix
        description: "Código postal do cliente"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
      - name: customer_city
        description: "Cidade onde o cliente reside"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
      - name: customer_state
        description: "Estado onde o cliente reside"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
      - name: is_active
        description: "Indica se o cliente está ativo ou não"
        data_type: BOOL
        primary_key: false
        tests:
          - not_null
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_geolocation
    columns:
      - name: geolocation_zip_code_prefix
        description: "Código postal utilizado para identificar um endereço"
        data_type: INTEGER
        tests:
          - not_null
      - name: geolocation_state
        description: "Refere-se a um estado brasileiro"
        data_type: STRING
        tests:
          - not_null
      - name: geolocation_city
        description: "Refere-se a uma cidade brasileira"
        data_type: STRING
        tests:
          - not_null
      - name: geolocation_lat
        description: "Distância, medida em graus, de qualquer ponto da Terra até a linha do Equador"
        data_type: NUMERIC
      - name: geolocation_lat
        description: "Coordenada geográfica que especifica a posição leste-oeste de qualquer ponto da Terra"
        data_type: NUMERIC
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_products
    columns:
      - name: product_id
        description: "Código único de um produto"
        data_type: STRING
        primary_key: true
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Nome da categoria de um produto"
        data_type: STRING
        tests:
          - not_null
      - name: product_name_length
        description: "Quantidade de caracteres do nome do produto"
        data_type: INTEGER
      - name: product_description_length
        description: "Quantidade de caracteres da descrição do produto"
        data_type: INTEGER
      - name: product_photos_qty
        description: "Quantidade de fotos que o produto possui"
        data_type: INTEGER
      - name: product_weight_g
        description: "Peso do produto calculado em gramas"
        data_type: NUMERIC
        tests:
          - not_null
      - name: product_length_cm
        description: "Comprimento do produto medido em centímetros"
        data_type: NUMERIC
        tests:
          - not_null
      - name: product_height_cm
        description: "Altura do produto medida em centímetros"
        data_type: NUMERIC
        tests:
          - not_null
      - name: product_width_cm
        description: "Largura do produto medida em centímetros"
        data_type: NUMERIC
        tests:
          - not_null
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_sellers
    columns:
      - name: seller_id
        description: "Código único de um fornecedor"
        data_type: STRING
        primary_key: true
        tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: "Código postal do cliente"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
      - name: seller_city
        description: "Cidade onde o fornecedor está localizado"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
      - name: seller_state
        description: "Estado onde o fornecedor está localizado"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        description: "Código único de uma compra"
        data_type: STRING
        primary_key: true
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Código único de um cliente que efetuou a compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: "Status da compra desde que ela foi realizada até a sua conclusão"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable
      - name: order_purchase_timestamp
        description: "Data em que a compra foi realizada pelo cliente"
        data_type: DATETIME
        primary_key: false
        tests:
          - not_null
      - name: order_approved_at
        description: "Data em que a compra foi aprovada após o pagamento"
        data_type: DATETIME
        primary_key: false
      - name: order_delivered_carrier_date
        description: "Data em que a compra foi entregue à transportadora pelo fornecedor"
        data_type: DATETIME
        primary_key:
      - name: order_estimated_delivery_date
        description: "Data em que a compra está prevista para ser entregue ao cliente"
        data_type: DATETIME
        primary_key: false
      - name: order_delivered_customer_date
        description: "Data em que a compra foi entregue ao cliente"
        data_type: DATETIME
        primary_key: false
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_orders_items
    columns:
      - name: order_id
        description: "Código único de uma compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: "Número sequencial que identifica qual a posição do item na compra"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
      - name: product_id
        description: "Código único de um produto"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        description: "Código único de um fornecedor"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        description: "Preço bruto do produto sem o frete"
        data_type: NUMERIC
        primary_key: false
        tests:
          - not_null
      - name: freight_value
        description: "Valor do frete para o envio do produto"
        data_type: NUMERIC
        primary_key: false
        tests:
          - not_null
      - name: shipping_limit_date
        description: "Data limite para que o produto seja entregue à transportadora pelo fornecedor"
        data_type: DATETIME
        primary_key: false
        tests:
          - not_null
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_orders_payments
    columns:
      - name: order_id
        description: "Código único de uma compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        description: "Número sequencial que identifica qual a posição do item no pagamento"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
      - name: payment_type
        description: "Meio de pagamento utilizado para pagar um item da compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - boleto
                  - credit_card
                  - debit_card
                  - voucher
      - name: payment_value
        description: "Valor total do produto incluindo o custo do frete"
        data_type: NUMERIC
        primary_key: false
        tests:
          - not_null
      - name: payment_installments
        description: "Quantidade de parcelas utilizadas para pagar um produto"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null
  - name: stg_orders_reviews
    columns:
      - name: order_id
        description: "Código único de uma compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_id
        description: "Código único de uma avaliação de uma compra"
        data_type: STRING
        primary_key: false
        tests:
          - not_null
      - name: review_score
        description: "Nota de avaliação de uma compra em um range de 1 a 5"
        data_type: INTEGER
        primary_key: false
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: review_comment_title
        description: "Título do comentário deixado na avaliação de uma compra"
        data_type: STRING
        primary_key: false
      - name: review_creation_date
        description: "Data em que uma avaliação foi realizada"
        data_type: DATETIME
        primary_key: false
        tests:
          - not_null
      - name: review_comment_message
        description: "Mensagem do comentário deixado na avaliação de uma compra"
        data_type: STRING
        primary_key: false
      - name: review_answer_timestamp
        description: "Data em que uma avaliação foi respondida pela equipe de atendimento da empresa"
        data_type: DATETIME
        primary_key: false
      - name: updated_at
        description: "Data da última atualização do registro"
        data_type: TIMESTAMP
        primary_key: false
        tests:
          - not_null